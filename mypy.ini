[mypy]
# Pragmatic baseline: only the core/ package is checked in CI for now.
# follow_imports=silent keeps type info for core/'s dependencies (server, api,
# services) but only reports diagnostics for files under core/ itself.
python_version = 3.10
ignore_missing_imports = True
no_strict_optional = True
check_untyped_defs = True
follow_imports = silent

# `deprecated` 3.x (pulled transitively through limits -> apscheduler) now ships
# py.typed and uses PEP 695 `type` aliases. mypy cannot parse that syntax while
# targeting 3.10, and a syntax error aborts the whole run, so skip the package
# rather than raising the target: the project's own code stays 3.10-compatible
# (see ruff target-version in pyproject.toml).
[mypy-deprecated.*]
follow_imports = skip
