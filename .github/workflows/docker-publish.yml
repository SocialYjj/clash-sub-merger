name: Build and Push Docker Image

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/socialyjj/clash-sub-merger

jobs:
  # Each platform is built on its own native runner. Emulating linux/arm64 with
  # QEMU on an amd64 runner multiplied build time by roughly 20x (a single Go
  # compile took 1312s and `npm ci` never returned), so the legs are split and
  # their digests are merged into one multi-arch manifest by the job below.
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build into the local daemon so the scan still runs, but
      # nothing is published and no release tags are touched.
      - name: Build image (pull request)
        id: build_pr
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: local/clash-sub-merger:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # A release pushes one single-platform image per digest; the merge job
      # turns the collected digests into the tagged manifest list.
      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # Trivy resolves a platform out of the remote reference. Each leg's index
      # holds only its own architecture plus an attestation manifest, so asking
      # for the digest directly made the scan look for the missing architecture
      # (that is what broke the arm64 leg). Resolve the platform-specific
      # manifest digest first and hand that to Trivy instead.
      - name: Resolve platform manifest digest
        id: platform
        if: github.event_name != 'pull_request'
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          digest=$(docker buildx imagetools inspect --raw "${IMAGE_NAME}@${INDEX_DIGEST}" \
            | jq -r --arg p "$TARGET_PLATFORM" \
              '[.manifests[]? | select(.platform != null and .platform.os != null) | select((.platform.os + "/" + .platform.architecture) == $p) | .digest] | first // empty')
          if [ -z "$digest" ]; then
            echo "::error::No manifest for $TARGET_PLATFORM in $INDEX_DIGEST"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Trivy's installer resolves its download through get.trivy.dev, which is
      # currently NXDOMAIN, so setup-trivy aborts before the scan even starts.
      # Fetch the release tarball straight from GitHub and skip the action's own
      # installer instead of blocking releases on that redirector.
      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.70.0
          TRIVY_ARCH: ${{ matrix.arch == 'amd64' && '64bit' || 'ARM64' }}
        run: |
          tarball="trivy_${TRIVY_VERSION#v}_Linux-${TRIVY_ARCH}.tar.gz"
          curl -sSfL --retry 3 --retry-delay 2 \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${tarball}" \
            -o /tmp/trivy.tar.gz
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Generate Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ github.event_name == 'pull_request' && format('local/clash-sub-merger:{0}-{1}', github.sha, matrix.arch) || format('{0}@{1}', env.IMAGE_NAME, steps.platform.outputs.digest) }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.arch }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: 'trivy-results-${{ matrix.arch }}.sarif'
          category: trivy-${{ matrix.arch }}
        if: always() && github.event_name != 'pull_request'

      - name: Block fixable Critical and High vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ github.event_name == 'pull_request' && format('local/clash-sub-merger:{0}-{1}', github.sha, matrix.arch) || format('{0}@{1}', env.IMAGE_NAME, steps.platform.outputs.digest) }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
