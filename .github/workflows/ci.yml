name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check . --output-format=github

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Run mypy (core)
        run: mypy core/

      - name: Compile all Python modules
        run: |
          python -m py_compile $(git ls-files '*.py')

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.11'
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.22.0'

      # package-lock.json pins the Playwright version, so the cache key rotates
      # whenever the browser bundle may change.
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Build frontend
        working-directory: submerger
        run: |
          npm ci
          npm run build

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run E2E smoke tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  go-speedtest:
    name: Go speedtest tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speedtest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: speedtest/go.sum

      - name: Run Go tests
        run: go test ./...

      - name: Build Linux speedtest binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags with_gvisor -o /tmp/speedtest-ci .

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submerger
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: submerger/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
